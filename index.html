<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan Cut Fatimah & Muhammad Isa</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #121212;
            color: #d4af37;
            font-family: 'Montserrat', sans-serif;
            text-align: center;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }
        .container {
            max-width: 400px;
            padding: 20px;
            width: 100%;
        }
        .subtitle {
            font-size: 12px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 20px;
            color: #c5a059;
        }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 40px;
            font-weight: 400;
            font-style: italic;
            color: #ffffff;
            margin-bottom: 5px;
        }
        .amp {
            font-family: 'Cormorant Garamond', serif;
            font-size: 30px;
            color: #d4af37;
            display: block;
            margin: 5px 0;
        }
        .date {
            font-size: 14px;
            letter-spacing: 4px;
            margin: 25px 0 35px 0;
            color: #d4af37;
        }
        .guest-box {
            margin-bottom: 30px;
        }
        .guest-label {
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #888;
            margin-bottom: 8px;
        }
        .guest-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 24px;
            font-style: italic;
            color: #d4af37;
        }
        .btn {
            display: inline-block;
            padding: 12px 30px;
            border: 1px solid #d4af37;
            color: #d4af37;
            text-decoration: none;
            border-radius: 30px;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        .btn:hover {
            background-color: #d4af37;
            color: #121212;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="subtitle">Undangan Pernikahan</div>
        
        <h1>Cut Fatimah</h1>
        <span class="amp">&</span>
        <h1>Muhammad Isa</h1>
        
        <div class="date">18 &bull; 10 &bull; 2026</div>
        
        <div class="guest-box">
            <div class="guest-label">Kepada Yth.</div>
            <div class="guest-name">Bapak/Ibu/Saudara/i</div>
        </div>

        <a href="home.html" class="btn">Buka Undangan</a>
    </div>

</body>
</html>
